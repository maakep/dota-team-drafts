name: Save draft

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Draft JSON
        required: true
        type: string
      previous:
        description: Fingerprint of the original draft, empty for a new draft
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: repository-data
  cancel-in-progress: false

jobs:
  save:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate and write draft
        env:
          DRAFT_JSON: ${{ inputs.draft }}
          DRAFT_PREVIOUS: ${{ inputs.previous }}
        run: node scripts/save-draft.mjs
      - name: Commit draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/drafts
          if ! git diff --cached --quiet; then
            git commit -m "Save draft"
            git push origin HEAD:main
          fi
